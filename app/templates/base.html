<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SGD-SINOLE{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f5f6fa; }
    .badge-estado { min-width: 90px; }
    .sem-en_plazo   { background-color: #198754 !important; }
    .sem-por_vencer { background-color: #fd7e14 !important; }
    .sem-vencido    { background-color: #dc3545 !important; }
    .sem-cerrado    { background-color: #6c757d !important; }
    .sem-no_aplica  { background-color: #adb5bd !important; }

    /* Accesibilidad: foco visible claro */
    *:focus-visible {
      outline: 3px solid #0d6efd !important;
      outline-offset: 2px !important;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="{{ url_for('panel') }}">SGD-SINOLE</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="{{ url_for('panel') }}">Panel</a></li>
          {% if puede_crear %}
          <li class="nav-item"><a class="nav-link" href="{{ url_for('formulario_registro') }}">Registrar documento</a></li>
          {% endif %}
        </ul>

        {% if user %}
        <div class="navbar-nav ms-auto align-items-center gap-2">
          <span class="nav-link text-light small">
            <strong>{{ user.nombre }}</strong> <span class="badge bg-secondary">{{ user.rol.value }}</span>
          </span>
          <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Salir</a>
        </div>
        {% endif %}
      </div>
    </div>
  </nav>

  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
